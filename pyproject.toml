[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aetherself"
version = "1.0.0"
description = "Autonomous Self-Healing Edge Agent Framework Using Contextual RAG and Model-Switching"
readme = "README.md"
authors = [{ name = "AetherSelf Research & Edge AI Team" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "psutil>=5.9.0",
    "scikit-learn>=1.2.0",
    "numpy>=1.22.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.4.0"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.20.0"]

[project.scripts]
aetherself = "aetherself.cli:main"
